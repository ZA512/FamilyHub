name: familyhub

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-familyhub}
      POSTGRES_USER: ${POSTGRES_USER:-familyhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD doit être défini dans .env}
    volumes:
      - familyhub_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - familyhub_internal
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  app:
    image: ${FAMILYHUB_IMAGE:-ghcr.io/za512/familyhub}:${FAMILYHUB_VERSION:-0.1.0}
    pull_policy: always
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      FAMILYHUB_ORIGIN: ${FAMILYHUB_ORIGIN:?FAMILYHUB_ORIGIN doit être défini dans .env}
      FAMILYHUB_TIMEZONE: ${FAMILYHUB_TIMEZONE:-Europe/Paris}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://${POSTGRES_USER:-familyhub}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-familyhub}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET doit être défini dans .env}
      SETUP_TOKEN: ${SETUP_TOKEN:?SETUP_TOKEN doit être défini dans .env}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-720}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-26214400}
      ATTACHMENTS_DIR: /data/attachments
    ports:
      - "${FAMILYHUB_PORT:-3080}:3000"
    volumes:
      - familyhub_attachments:/data/attachments
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - familyhub_internal
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  familyhub_internal:
    driver: bridge

volumes:
  familyhub_db_data:
  familyhub_attachments:
